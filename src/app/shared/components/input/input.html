<div>
  <label [for]="id()" class="block mb-1 font-medium">{{label()}}</label>
  <input
    [type]="type()"
    [name]="name()"
    [id]="id()"
    [placeholder]="placeholder()"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onTouched()"
    class="w-full border rounded px-3 py-2"
  >

  @if (error()) {
    <app-error message="{{ error() }}"/>
  }

</div>
