<div class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-8 border rounded-lg shadow">

    <h1 class="text-2xl font-bold text-center mb-6">Cadastre-se</h1>

    <form class="space-y-4">
      <app-input label="Nome:" type="name" name="name" id="name"/>

      <app-input label="E-mail:" type="email" name="email" id="email"/>

      <app-input label="Senha:" type="password" name="password" id="password"/>

      <app-button label="Cadastrar"/>
    </form>

    <p class="text-center mt-4">
      Já possui uma conta?
      <a routerLink="/login" class="underline">Entrar</a>
    </p>

  </div>
</div>
