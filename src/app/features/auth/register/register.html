<div class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-8 border rounded-lg shadow">

    <h1 class="text-2xl font-bold text-center mb-6">Cadastre-se</h1>

    <form class="space-y-4" [formGroup]="registerForm" (ngSubmit)="register()">
      <app-input label="Nome:" type="name" id="name" formControlName="name" [error]="nameError"/>

      <app-input label="E-mail:" type="email" id="email" formControlName="email" [error]="emailError"/>

      <app-input label="Senha:" type="password" id="password" formControlName="password" [error]="passwordError"/>

      <app-button label="Cadastrar"/>
    </form>

    <p class="text-center mt-4">
      Já possui uma conta?
      <a routerLink="/login" class="underline">Entrar</a>
    </p>

  </div>
</div>
