<div class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-8 border rounded-lg shadow">

    <h1 class="text-2xl font-bold text-center mb-6">Login</h1>

    <form class="space-y-4">
      <div>
        <label for="email" class="block mb-1 font-medium">E-mail:</label>
        <input type="email" name="email" id="email" class="w-full border rounded px-3 py-2">
      </div>
      <div class="flex flex-col">
        <label for="password" class="block mb-1 font-medium">Senha:</label>
        <input type="password" name="password" id="password" class="w-full border rounded px-3 py-2">
      </div>

      <button type="submit" class="w-full rounded py-2 font-medium">Entrar</button>
    </form>

    <p class="text-center mt-4">
      Não possui uma conta?
      <a routerLink="/register" class="underline">Cadastre-se</a>
    </p>

  </div>
</div>
