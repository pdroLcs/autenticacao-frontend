<div class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-8 border rounded-lg shadow">

    <h1 class="text-2xl font-bold text-center mb-6">Login</h1>

    <form class="space-y-4" [formGroup]="loginForm" (ngSubmit)="login()">

      <app-input label="E-mail:" type="email" name="email" id="email" formControlName="email"/>

      <app-input label="Senha:" type="password" name="password" id="password" formControlName="password"/>

      <app-button label="Entrar" [ariaDisabled]="loginForm.invalid"/>
    </form>

    <p class="text-center mt-4">
      Não possui uma conta?
      <a routerLink="/register" class="underline">Cadastre-se</a>
    </p>

  </div>
</div>
